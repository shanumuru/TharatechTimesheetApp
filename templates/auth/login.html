{% extends 'base.html' %}
{% block title %}Login – Tharatech Timesheet{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <i class="bi bi-clock-history display-3 text-primary"></i>
          <h3 class="mt-2 mb-0">Tharatech Timesheet</h3>
          <p class="text-muted small">Sign in with your Google account</p>
        </div>
        <a href="{{ url_for('auth.google_login') }}" class="btn btn-outline-dark w-100 py-2 d-flex align-items-center justify-content-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.14 0 5.95 1.08 8.17 2.86l6.09-6.09C34.46 3.06 29.55 1 24 1 14.82 1 7.01 6.43 3.42 14.15l7.08 5.5C12.24 13.38 17.67 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.52 24.5c0-1.64-.15-3.22-.42-4.74H24v8.98h12.67c-.55 2.93-2.2 5.41-4.67 7.07l7.18 5.57C43.43 37.35 46.52 31.37 46.52 24.5z"/>
            <path fill="#FBBC05" d="M10.5 28.35A14.57 14.57 0 0 1 9.5 24c0-1.51.26-2.97.72-4.35l-7.08-5.5A23.94 23.94 0 0 0 0 24c0 3.87.92 7.52 2.55 10.75l7.95-6.4z"/>
            <path fill="#34A853" d="M24 47c5.55 0 10.21-1.84 13.61-4.99l-7.18-5.57C28.6 37.98 26.42 38.5 24 38.5c-6.33 0-11.76-3.88-13.5-9.15l-7.95 6.4C6.01 41.57 13.82 47 24 47z"/>
          </svg>
          Sign in with Google
        </a>
      </div>
    </div>
    <p class="text-center text-muted small mt-3">Contact your administrator for access.</p>
  </div>
</div>
{% endblock %}
